# Publica apps/web no GitHub Pages (https://larallc.github.io/Hackathon-Nasa-SpaceApps/).
# Site estático em modo fixture: lê o demo-pack REAL pré-calculado (apps/web/public/demo-pack), sem backend.
# Settings → Pages → Source: GitHub Actions.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-api:
    name: API tests (pytest, synthetic weather)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/simulation/requirements.txt
      - run: pip install -r apps/api/simulation/requirements.txt
      - run: pytest -q apps/api/tests

  build:
    name: Build web (fixture mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build (tsc -b + vite build)
        run: npm run build
        env:
          VITE_DATA_SOURCE: fixture
          VITE_DEFAULT_LANG: en
      - name: SPA fallback (deep links como /Hackathon-Nasa-SpaceApps/simular)
        run: cp dist/index.html dist/404.html
      - name: Sanity check do artefato
        run: |
          test -f dist/index.html && test -f dist/404.html && test -f dist/demo-pack/index.json
          grep -q '/Hackathon-Nasa-SpaceApps/assets/' dist/index.html
          ls dist/demo-pack | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [test-api, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
